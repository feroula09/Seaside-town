<style>
/* Layout: full-bleed WebGL diorama over a painted atmosphere canvas; a floating control console docks right (bottom sheet on phones). */
:root{
  color-scheme: dark;
  --bg:#1d2357;
  --title:#f7f3ff;
  --ink:#eef0fa;
  --ink-dim:rgba(238,240,250,.58);
  --panel:rgba(26,31,58,.90);
  --line:rgba(255,255,255,.09);
  --btn:rgba(255,255,255,.03);
  --btn-line:rgba(255,255,255,.12);
  --btn-hover:rgba(255,255,255,.08);
  --chip-on:#f1efe9;
  --chip-on-ink:#1d2340;
  --track:rgba(255,255,255,.16);
  --knob:#f6f5f2;
  --live:#3ccf8e;
  --hint:rgba(22,26,50,.82);
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
body[data-atmo="day"]{
  --bg:#bfe0f2; --title:#ffffff; --panel:rgba(30,52,70,.88); --chip-on:#eaf6fb; --chip-on-ink:#1e3446; --hint:rgba(30,52,70,.8);
}
body[data-atmo="sunset"]{
  --bg:#e7c2c4; --title:#fff8f2; --panel:rgba(72,50,54,.90); --chip-on:#f7dcc6; --chip-on-ink:#3d2a2c; --hint:rgba(72,50,54,.82);
}
body[data-atmo="night"]{
  --bg:#0c1230; --title:#eef1ff; --panel:rgba(18,23,46,.92); --chip-on:#dfe5ff; --chip-on-ink:#151a33; --hint:rgba(18,23,46,.85);
}
html,body{height:100%;}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;touch-action:none;}
#bg,#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
#bg{z-index:0;}
#gl{z-index:1;outline:none;}
.brand{position:fixed;z-index:3;left:calc(28px + env(safe-area-inset-left,0px));top:calc(22px + env(safe-area-inset-top,0px));pointer-events:none;color:var(--title);text-shadow:0 2px 18px rgba(0,0,0,.18);}
.brand small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;opacity:.8;}
.brand h1{margin:2px 0 0;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(30px,3.2vw,42px);line-height:1;letter-spacing:-.01em;}
.badge{position:fixed;z-index:3;right:calc(30px + env(safe-area-inset-right,0px));top:calc(26px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.01em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);}
.panel{position:fixed;z-index:4;right:calc(30px + env(safe-area-inset-right,0px));top:calc(68px + env(safe-area-inset-top,0px));width:252px;max-height:calc(100% - 96px);overflow:auto;padding:16px 16px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:11px;scrollbar-width:thin;}
.panel h2{margin:0;font-family:var(--display);font-style:italic;font-weight:400;font-size:17px;letter-spacing:.005em;font-variant-numeric:tabular-nums;}
.prog{height:2px;margin:8px 0 10px;background:var(--line);border-radius:2px;overflow:hidden;}
.prog b{display:block;height:100%;width:0;background:var(--ink);opacity:.7;transition:width .4s ease;}
.stats{display:flex;justify-content:space-between;color:var(--ink-dim);font-variant-numeric:tabular-nums;padding-bottom:11px;border-bottom:1px solid var(--line);}
.stats b{color:var(--ink);font-weight:700;margin-left:2px;}
.sec{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink-dim);margin:14px 0 7px;}
.sec span:last-child{font-size:10px;}
.row{display:grid;gap:5px;}
.c2{grid-template-columns:1fr 1fr;}
.c3{grid-template-columns:repeat(3,1fr);}
.c4{grid-template-columns:repeat(4,1fr);}
.seg{background:rgba(255,255,255,.035);border-radius:7px;padding:3px;gap:3px;}
button{font:inherit;font-size:11px;font-weight:600;color:var(--ink);background:var(--btn);border:1px solid var(--btn-line);border-radius:6px;padding:7px 4px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
button:hover{background:var(--btn-hover);}
button:focus-visible{outline:2px solid var(--chip-on);outline-offset:1px;}
.seg button{border-color:transparent;background:transparent;font-weight:500;}
.seg button:hover{background:var(--btn-hover);}
button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:600;}
button.primary{width:100%;background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);padding:8px 4px;margin-top:11px;margin-bottom:5px;}
button.primary:hover{filter:brightness(1.06);}
button:disabled{opacity:.45;cursor:default;}
.divider{height:1px;background:var(--line);margin:14px 0 2px;}
.slider{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:4px;margin-top:10px;color:var(--ink-dim);}
.slider output{color:var(--ink);font-variant-numeric:tabular-nums;font-size:10.5px;}
.slider input{grid-column:1/-1;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--track);border-radius:2px;}
input[type=range]::-moz-range-track{height:2px;background:var(--track);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:var(--knob);border:0;box-shadow:0 1px 4px rgba(0,0,0,.3);}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--knob);border:0;}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--chip-on);}
.foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.hint{position:fixed;z-index:3;left:calc(30px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 340px);padding:7px 14px;border-radius:99px;background:var(--hint);border:1px solid var(--line);font-size:11px;color:var(--ink-dim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.hint b{color:var(--ink);font-weight:700;}
.toast{position:fixed;z-index:5;left:50%;top:calc(26px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:11.5px;font-weight:600;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.handle{display:none;}
.err{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;color:var(--ink);}
@media (max-width:720px){
  .brand{left:16px;top:calc(14px + env(safe-area-inset-top,0px));}
  .brand h1{font-size:28px;}
  .badge{right:16px;top:calc(16px + env(safe-area-inset-top,0px));font-size:10px;padding:6px 10px;}
  .panel{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;max-height:46%;padding:10px 14px 12px;}
  .panel.collapsed .body{display:none;}
  .handle{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:4px 0 6px;font-size:11px;color:var(--ink-dim);}
  .handle:hover{background:transparent;}
  .hint{display:none;}
  .toast{top:calc(66px + env(safe-area-inset-top,0px));}
}
@media (prefers-reduced-motion:reduce){ .prog b,.toast{transition:none;} }
</style>

    <div class="row c3" id="views" style="margin-top:6px">

      <button data-view="hillside">Hillside</button><button data-view="terminal">Terminal</button><button data-view="deck">Ship Deck</button>

    <div class="divider"></div>

  </div>
</aside>

<div class="hint"><b>How to play</b> — Drag water for waves · Drag block side to tip · Tap water to throw lifebuoys · Right-drag to orbit · Press V to walk</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){ fail('The 3D library did not load. Check your connection and reload.'); return; }
function fail(msg){ const d=document.createElement('div'); d.className='err'; d.textContent=msg; document.body.appendChild(d); }

/* ---------------------------------------------------------------- renderer */
const canvas=$('#gl');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
catch(e){ fail('This harbor needs WebGL, which this browser could not start.'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0x000000,0);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,0.05,500);

const C=h=>new THREE.Color(h).convertSRGBToLinear();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const approach=(c,t,s)=>Math.abs(t-c)<=s?t:c+Math.sign(t-c)*s;
let seed=7; const srand=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

/* ---------------------------------------------------------------- lights */
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.7); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.4);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-21; sc.right=21; sc.top=21; sc.bottom=-21; sc.near=1; sc.far=90;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03;
scene.add(sun,sun.target);

/* ---------------------------------------------------------------- diorama groups */
const PIV_Y=-1.6;
const pivot=new THREE.Group(); pivot.position.set(0,PIV_Y,0); scene.add(pivot);
const dio=new THREE.Group(); dio.position.set(0,-PIV_Y,0); pivot.add(dio);

const matCache={};
function M(hex,o){ const k=hex+(o?JSON.stringify(o):''); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:C(hex),roughness:.85,metalness:0,flatShading:true},o||{})); return matCache[k]; }
const BOX=new THREE.BoxGeometry(1,1,1);
function box(w,h,d,mat,x,yb,z,parent,noCast){ const m=new THREE.Mesh(BOX,mat); m.scale.set(w,h,d); m.position.set(x,yb+h/2,z); m.castShadow=!noCast; m.receiveShadow=true; (parent||dio).add(m); return m; }
function cyl(rt,rb,h,mat,x,yb,z,parent,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||10),mat); m.position.set(x,yb+h/2,z); m.castShadow=true; m.receiveShadow=true; (parent||dio).add(m); return m; }
function beam(a,b,t,mat,parent){ const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b); const dir=B.clone().sub(A); const len=dir.length(); const m=new THREE.Mesh(BOX,mat); m.scale.set(t,t,len); m.position.copy(A).add(B).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir.normalize()); m.castShadow=true; (parent||dio).add(m); return m; }
function canvasTex(w,h,draw,repeat){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} t._cv=c; return t; }

/* ---------------------------------------------------------------- world dimensions */
const HALF=12;            // block spans x,z in [-12,12]
const QUAY_Z=-3;          // quay wall face
const QUAY_Y=3.6;
const BASE_L=3.0;         // calm water level
let L=BASE_L;
const TIER=k=>({y:QUAY_Y+0.5*(k+1), front:-7-1.25*k});

/* ---------------------------------------------------------------- textures */
const strataPalettes={
  day:   ['#e7cf9f','#d7a96d','#c88c5a','#b5734f','#8d5b45','#6d4a3e'],
  sunset:['#f3d3b4','#eab394','#dd9a86','#c98272','#a86a64','#7d5257'],
  night: ['#3b4a74','#33416a','#2b375e','#263154','#202a49','#1a223d'],
  cosmos:['#3a4f86','#33467a','#2c3d6c','#29365f','#242f52','#1d2645']
};
const strataTex=canvasTex(512,160,()=>{},false);
function paintStrata(pal){
  const c=strataTex._cv, g=c.getContext('2d'), w=c.width, h=c.height;
  g.clearRect(0,0,w,h);
  const n=pal.length;
  for(let b=0;b<n;b++){
    g.fillStyle=pal[b]; g.beginPath();
    const y0=h*b/n;
    g.moveTo(0,h);
    for(let x=0;x<=w;x+=8){ const y=y0+ (b?Math.sin(x*0.018+b*1.7)*5+Math.sin(x*0.051+b)*2.5:0); g.lineTo(x,y); }
    g.lineTo(w,h); g.closePath(); g.fill();
  }
  for(let i=0;i<220;i++){ g.fillStyle='rgba(255,255,255,'+(Math.random()*0.08)+')'; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  strataTex.needsUpdate=true;
}
const stoneTex=canvasTex(256,64,(g,w,h)=>{
  g.fillStyle='#d9cdb8'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(90,70,50,.22)'; g.lineWidth=1.2;
  for(let r=0;r<4;r++){ const y=r*16; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
    for(let x=(r%2)*16;x<w;x+=32){ g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+16); g.stroke(); } }
  for(let i=0;i<300;i++){ g.fillStyle='rgba(0,0,0,'+Math.random()*0.05+')'; g.fillRect(Math.random()*w,Math.random()*h,3,2); }
},true);
stoneTex.repeat.set(4,1);
const quayFaceTex=canvasTex(1024,128,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#ddd0b8'); gr.addColorStop(.25,'#cfc0a5'); gr.addColorStop(.36,'#8f8a76'); gr.addColorStop(1,'#4d5a58');
  g.fillStyle=gr; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(60,50,40,.25)'; g.lineWidth=1;
  for(let y=0;y<h;y+=9){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); for(let x=((y/9)%2)*12;x<w;x+=24){ g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+9); g.stroke(); } }
  // arches above the waterline (water sits at ~17% from top)
  g.fillStyle='#263049';
  for(let i=0;i<20;i++){ const x=18+i*51, aw=22, top=7, bot=34; g.beginPath(); g.moveTo(x,bot); g.lineTo(x,top+aw/2); g.arc(x+aw/2,top+aw/2,aw/2,Math.PI,0); g.lineTo(x+aw,bot); g.closePath(); g.fill(); }
  g.fillStyle='#e9dfcc'; g.fillRect(0,0,w,4);
},false);
const grassTex=canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#b9c98a'; g.fillRect(0,0,w,h); for(let i=0;i<500;i++){ g.fillStyle=Math.random()<.5?'rgba(80,110,40,.12)':'rgba(255,255,220,.12)'; g.fillRect(Math.random()*w,Math.random()*h,2,2);} },true);
grassTex.repeat.set(6,1);
const paveTex=canvasTex(128,128,(g,w,h)=>{ g.fillStyle='#d8cdbd'; g.fillRect(0,0,w,h); g.strokeStyle='rgba(80,70,60,.12)'; for(let x=0;x<w;x+=16){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); } for(let y=0;y<h;y+=16){ g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); } },true);
paveTex.repeat.set(12,2);
const containerTex=canvasTex(64,32,(g,w,h)=>{ g.fillStyle='#fff'; g.fillRect(0,0,w,h); for(let x=0;x<w;x+=4){ g.fillStyle='rgba(0,0,0,.13)'; g.fillRect(x,0,1.5,h);} g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(0,0,w,2); g.fillRect(0,h-2,w,2); g.fillRect(0,0,2,h); g.fillRect(w-2,0,2,h); },false);
const plankTex=canvasTex(64,64,(g,w,h)=>{ g.fillStyle='#b98a5c'; g.fillRect(0,0,w,h); for(let x=0;x<w;x+=8){ g.fillStyle='rgba(60,35,15,.25)'; g.fillRect(x,0,1,h);} },true);
plankTex.repeat.set(1,6);
function windowTex(lit,emissive){
  return canvasTex(64,64,(g,w,h)=>{
    g.fillStyle=emissive?'#000':'#ffffff'; g.fillRect(0,0,w,h);
    const wins=[[9,12],[37,12],[9,38],[37,38]];
    wins.forEach((p,i)=>{ if(emissive){ g.fillStyle=lit[i]?'#ffcf7a':'#000'; } else g.fillStyle='#3d4863'; g.fillRect(p[0],p[1],17,15); if(!emissive){ g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(p[0]+7.5,p[1],2,15); } });
  });
}
const glowTex=canvasTex(64,64,(g,w,h)=>{ const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,240,200,1)'); r.addColorStop(.25,'rgba(255,214,140,.55)'); r.addColorStop(1,'rgba(255,200,120,0)'); g.fillStyle=r; g.fillRect(0,0,w,h); });
// caustic web for the seabed
const causticTex=(function(){
  const S=256, pts=[]; for(let i=0;i<22;i++) pts.push([Math.random()*S,Math.random()*S]);
  return canvasTex(S,S,(g)=>{
    const img=g.createImageData(S,S);

    if(x>BW.x0&&x<BW.x1&&z>BW.z0+.05&&z<BW.z1-.05) return BW.top;
    return null; }
  if(z>=-7) return QUAY_Y;
  for(let k=3;k>=0;k--){ const t=TIER(k); if(z<t.front&&(k===3||z>=TIER(k+1).front)) return t.y; }
  return TIER(3).y;
}
const camLocal=new THREE.Vector3(), lookLocal=new THREE.Vector3();
function updateCamera(dt){
  if(tween){ tween.t=Math.min(1,tween.t+dt/1.3); const e=ease(tween.t);
    orbit.target.lerpVectors(tween.from.target,tween.to.target,e); orbit.r=lerp(tween.from.r,tween.to.r,e);
    let dth=tween.to.theta-tween.from.theta; dth=Math.atan2(Math.sin(dth),Math.cos(dth)); orbit.theta=tween.from.theta+dth*e; orbit.phi=lerp(tween.from.phi,tween.to.phi,e);
    if(tween.t>=1) tween=null; }
  if(camMode==='fp'){
    const sp=(fp.keys.ShiftLeft||fp.keys.ShiftRight?2.6:1.3)*dt;
    let mx=0,mz=0; if(fp.keys.KeyW||fp.keys.ArrowUp) mz+=1; if(fp.keys.KeyS||fp.keys.ArrowDown) mz-=1; if(fp.keys.KeyA||fp.keys.ArrowLeft) mx-=1; if(fp.keys.KeyD||fp.keys.ArrowRight) mx+=1;
    mz+=touchWalk;
    const fx=-Math.sin(fp.yaw), fz=-Math.cos(fp.yaw), rx=Math.cos(fp.yaw), rz=-Math.sin(fp.yaw);
    const nx=fp.x+(fx*mz+rx*mx)*sp, nz=fp.z+(fz*mz+rz*mx)*sp;
    if(landHeight(nx,nz)!==null){ fp.x=nx; fp.z=nz; } else if(landHeight(nx,fp.z)!==null) fp.x=nx; else if(landHeight(fp.x,nz)!==null) fp.z=nz;
    const ly=landHeight(fp.x,fp.z)??QUAY_Y; fp.y=lerp(fp.y??ly,ly,Math.min(1,dt*10));
    const bob=(mx||mz)?Math.sin(performance.now()*.012)*.012:0;
    camLocal.set(fp.x,fp.y+.32+bob,fp.z);
    lookLocal.set(fp.x+Math.sin(fp.yaw+Math.PI)*Math.cos(fp.pitch),fp.y+.32+Math.sin(fp.pitch),fp.z+Math.cos(fp.yaw+Math.PI)*Math.cos(fp.pitch));
    camera.position.copy(dio.localToWorld(camLocal.clone())); camera.lookAt(dio.localToWorld(lookLocal.clone()));
    camera.fov=60; camera.updateProjectionMatrix(); return;
  }
  if(camera.fov!==32){ camera.fov=32; camera.updateProjectionMatrix(); }
  if(camMode==='deck'&&ship.visible){
    camera.position.copy(ship.localToWorld(tmpV.set(-3.3,2.45,0)));
    camera.lookAt(ship.localToWorld(tmpW.set(3,1.2,0)));
    return;
  }
  const s=Math.sin(orbit.phi);
  camera.position.set(orbit.target.x+orbit.r*s*Math.sin(orbit.theta),orbit.target.y+orbit.r*Math.cos(orbit.phi),orbit.target.z+orbit.r*s*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
}

/* ---------------------------------------------------------------- jelly tipping */
const jelly={ax:0,az:0,vx:0,vz:0,tx:0,tz:0};
function updateJelly(dt){
  const k=26*firmness, c=1.6+1.4*damping;
  const pvx=jelly.vx, pvz=jelly.vz;
  jelly.vx+=(k*(jelly.tx-jelly.ax)-c*jelly.vx)*dt; jelly.vz+=(k*(jelly.tz-jelly.az)-c*jelly.vz)*dt;
  jelly.ax+=jelly.vx*dt; jelly.az+=jelly.vz*dt;
  pivot.rotation.set(jelly.ax,0,jelly.az);
  const sp=Math.hypot(jelly.vx,jelly.vz);
  pivot.scale.set(1+sp*.012,1-sp*.022,1+sp*.012);
  bulge=clamp(sp*.09,0,.35);
  const dvx=jelly.vx-pvx, dvz=jelly.vz-pvz;
  if(Math.abs(dvx)+Math.abs(dvz)>1e-5){ const s=.12;
    for(let j=0;j<NZ;j++){ const z=WZ0+j*DZ-4.5; for(let i=0;i<NX;i++){ const k2=j*NX+i; if(MASK[k2]) continue; V[k2]+=(-(WX0+i*DX)*dvz+z*dvx)*s*.02; } } }
}

/* ---------------------------------------------------------------- input */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const pointers=new Map();
let gesture=null, touchWalk=0, lastSplashSound=0;
function pick(e,objs){ const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera); return ray.intersectObjects(objs,true)[0]||null; }
const waterPlane=new THREE.Plane();
function waterPoint(e){ const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ndc,camera);
  const n=new THREE.Vector3(0,1,0).transformDirection(dio.matrixWorld); const p0=dio.localToWorld(new THREE.Vector3(0,L,0)); waterPlane.setFromNormalAndCoplanarPoint(n,p0);
  const hit=ray.ray.intersectPlane(waterPlane,new THREE.Vector3()); if(!hit) return null; const loc=dio.worldToLocal(hit); if(loc.x<WX0||loc.x>WX1||loc.z<WZ0||loc.z>WZ1) return null; return loc; }
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  audioStart();
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; gesture={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),r:orbit.r}; return; }
  const g={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:performance.now(),moved:0,button:e.button};
  if(camMode==='fp'){ g.type='look'; gesture=g; return; }
  if(e.button===2||e.button===1){ g.type='orbit'; gesture=g; return; }
  const hit=pick(e,[waterTop,wallFront,wallLeft,wallRight,...sideTargets,ship,...cranes.map(c=>c.g),...houseMeshes,roofMesh]);
  if(hit&&hit.object===waterTop){ g.type='water'; g.last=waterPoint(e); }
  else if(hit&&([wallFront,wallLeft,wallRight].includes(hit.object)||(sideTargets.includes(hit.object)&&hit.face&&Math.abs(hit.face.normal.y)<.5))){ g.type='tip'; }
  else if(!hit){ const p=waterPoint(e); g.type='orbit'; }
  else g.type='orbit';
  gesture=g;
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const g=gesture; if(!g) return;
  if(g.type==='pinch'){ if(pointers.size<2) return; const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); orbit.r=clamp(g.r*g.d/Math.max(20,d),6,90); if(camMode==='deck') camMode='orbit'; return; }
  const dx=e.clientX-g.x, dy=e.clientY-g.y; g.x=e.clientX; g.y=e.clientY; g.moved+=Math.abs(dx)+Math.abs(dy);
  if(g.type==='look'){ fp.yaw-=dx*.005; fp.pitch=clamp(fp.pitch-dy*.004,-1.2,1.2); if(e.pointerType==='touch'){ touchWalk=clamp(-(e.clientY-g.y0)/120,-1,1); } return; }
  if(g.type==='orbit'){ if(g.moved<3) return; if(camMode==='deck'){ const p=ship.getWorldPosition(new THREE.Vector3()); const s=sphFrom(camera.position.toArray(),p.toArray()); Object.assign(orbit,s); orbit.target.copy(p); camMode='orbit'; }
    tween=null; orbit.theta-=dx*.006; orbit.phi=clamp(orbit.phi-dy*.005,.18,1.5); return; }
  if(g.type==='water'){ if(!running) return; const p=waterPoint(e); if(p&&g.moved>4){ const sp=Math.min(.18,(Math.hypot(dx,dy))*.004+.02); if(g.last){ const n=Math.ceil(g.last.distanceTo(p)/.35); for(let i=1;i<=n;i++){ const q=g.last.clone().lerp(p,i/n); addDrop(q.x,q.z,.85,sp/n*1.5);} } g.last=p;
      const now=performance.now(); if(now-lastSplashSound>260){ lastSplashSound=now; sfx.swish&&sfx.swish(Math.min(1,sp*6)); } } return; }
  if(g.type==='tip'){ const totx=e.clientX-g.x0, toty=e.clientY-g.y0;
    const f=new THREE.Vector3(); camera.getWorldDirection(f); f.y=0; f.normalize(); const r=new THREE.Vector3(-f.z,0,f.x);
    const s=.0016; const A=f.multiplyScalar(totx*s).add(r.multiplyScalar(toty*s));
    const m=Math.hypot(A.x,A.z), cap=.3; if(m>cap) A.multiplyScalar(cap/m);
    jelly.tx=A.x; jelly.tz=A.z; return; }
});
function endPointer(e){
  const g=gesture; pointers.delete(e.pointerId);
  if(g&&g.type==='pinch'){ if(pointers.size===0) gesture=null; return; }
  if(g&&g.type==='water'&&g.moved<6&&performance.now()-g.t0<450&&running){ const p=waterPoint(e); if(p&&!inSolid(p.x,p.z)) throwRing(new THREE.Vector3(p.x,L,p.z)); }
  if(g&&g.type==='tip'){ jelly.tx=0; jelly.tz=0; }
  if(g&&g.type==='look') touchWalk=0;
  if(pointers.size===0) gesture=null;
}
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); if(camMode==='fp') return; if(camMode==='deck'){ const p=ship.getWorldPosition(new THREE.Vector3()); Object.assign(orbit,sphFrom(camera.position.toArray(),p.toArray())); orbit.target.copy(p); camMode='orbit'; } tween=null; orbit.r=clamp(orbit.r*Math.exp(e.deltaY*.0012),6,90); },{passive:false});
window.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')&&e.code!=='KeyV') { if(e.target.tagName==='INPUT') return; }
  if(e.code==='KeyV'){ setCamMode(camMode==='fp'?'orbit':'fp'); e.preventDefault(); return; }
  if(camMode==='fp'&&['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)){ fp.keys[e.code]=true; e.preventDefault(); }
});
window.addEventListener('keyup',e=>{ fp.keys[e.code]=false; });
window.addEventListener('blur',()=>{ fp.keys={}; });

/* ---------------------------------------------------------------- audio */
let actx=null, master=null, soundOn=true, ambGain=null, noiseBuf=null;
function audioStart(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ actx=new AC(); }catch(e){ return; }
  master=actx.createGain(); master.gain.value=soundOn?.7:0; master.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate); const d=noiseBuf.getChannelData(0); let b=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; b=(b+.02*w)/1.02; d[i]=b*3.5+w*.15; }
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const bp=actx.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=520;
  ambGain=actx.createGain(); ambGain.gain.value=.12;
  const lfo=actx.createOscillator(); lfo.frequency.value=.13; const lg=actx.createGain(); lg.gain.value=.07; lfo.connect(lg); lg.connect(ambGain.gain); lfo.start();
  src.connect(bp); bp.connect(ambGain); ambGain.connect(master); src.start();
}
function noiseBurst(dur,freq,q,vol,type){ if(!actx) return; const t=actx.currentTime; const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q; const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+dur+.05); }
sfx.splash=v=>{ noiseBurst(.5,900,.7,.5*v); noiseBurst(.25,2600,1.2,.18*v); };
sfx.swish=v=>noiseBurst(.3,700+v*500,.9,.12+v*.15);
sfx.plop=()=>{ if(!actx) return; for(let i=0;i<6;i++){ const t=actx.currentTime+.05+i*.07+Math.random()*.05; const o=actx.createOscillator(); o.frequency.setValueAtTime(700+Math.random()*300,t); o.frequency.exponentialRampToValueAtTime(220,t+.08); const g=actx.createGain(); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+.1); o.connect(g); g.connect(master); o.start(t); o.stop(t+.12); } };
sfx.whoosh=()=>noiseBurst(.45,1400,.6,.12);
sfx.clank=v=>{ if(!actx) return; const t=actx.currentTime; const o=actx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(70,t+.12); const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=600; const g=actx.createGain(); g.gain.setValueAtTime(.09*v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+.2); noiseBurst(.12,1800,2,.06*v); };
sfx.horn=(v=1)=>{ if(!actx) return; const t=actx.currentTime; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520; f.Q.value=2; const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22*v,t+.15); g.gain.setValueAtTime(.22*v,t+1.5); g.gain.exponentialRampToValueAtTime(.0001,t+2.3); f.connect(g); g.connect(master);
  for(const fr of [87,87.6,130.5]){ const o=actx.createOscillator(); o.type='sawtooth'; o.frequency.value=fr; o.connect(f); o.start(t); o.stop(t+2.4); } };
sfx.gull=()=>{ if(!actx) return; const t=actx.currentTime; for(let i=0;i<2;i++){ const s=t+i*.22; const o=actx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(1500,s); o.frequency.exponentialRampToValueAtTime(1050,s+.18); const g=actx.createGain(); g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.035,s+.03); g.gain.exponentialRampToValueAtTime(.0001,s+.2); o.connect(g); g.connect(master); o.start(s); o.stop(s+.22); } };
function setSound(on){ soundOn=on; $('#sound').textContent='Sound: '+(on?'On':'Off'); if(master) master.gain.setTargetAtTime(on?.7:0,actx.currentTime,.05); }

/* ---------------------------------------------------------------- UI */
const stats={boxes:0,voyages:0,fed:0};
let toastTimer=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
function refreshUI(){
  $('#sBoxes').textContent=stats.boxes; $('#sVoy').textContent=stats.voyages; $('#sFed').textContent=stats.fed;
  const s=shipState, u=unloadedCount(); let label, prog;
  if(s.mode==='docked'){ if(s.departing){ label='Casting off'; prog=u/8; } else if(u>=8){ label='Unloaded 8 / 8'; prog=1; } else { label='Unloading '+(u+1)+' / 8'; prog=u/8; } }
  else if(s.mode==='out'){ label='Under way'; prog=s.u; }
  else if(s.mode==='away'){ label='At sea'; prog=1; }
  else { label='Inbound'; prog=s.u; }
  $('#status').textContent=label; $('#progBar').style.width=(prog*100).toFixed(1)+'%';
  const btn=$('#castOff'); btn.disabled=s.mode!=='docked'||s.departing; btn.textContent=s.mode==='docked'?(s.departing?'Casting off…':'Cast off'):'At sea';
}
let running=true;
$('#castOff').onclick=()=>{ audioStart(); castOff(); };
$('#horn').onclick=()=>{ audioStart(); sfx.horn(); };
$('#feed').onclick=()=>{ audioStart(); feedFish(); };
$('#camMode').onclick=e=>{ const b=e.target.closest('button'); if(b) setCamMode(b.dataset.mode); };
$('#views').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(camMode==='fp') setCamMode('orbit',true); setView(b.dataset.view); document.querySelectorAll('#camMode button').forEach(x=>x.classList.toggle('on',x.dataset.mode==='orbit')); };
$('#atmos').onclick=e=>{ const b=e.target.closest('button'); if(b) applyAtmo(b.dataset.atmo); };
$('#flavours').onclick=e=>{ const b=e.target.closest('button'); if(b) applyFlavour(b.dataset.flavour); };
$('#firm').oninput=e=>{ firmness=+e.target.value; $('#firmOut').textContent=firmness.toFixed(2); };
$('#damp').oninput=e=>{ damping=+e.target.value; $('#dampOut').textContent=damping.toFixed(2); };
$('#tide').oninput=e=>{ const v=+e.target.value; $('#tideOut').textContent=(v>0?'+':'')+v+' cm'; tideTarget=v/100*.42; };
let tideTarget=0;
$('#pause').onclick=()=>{ running=!running; $('#pause').textContent=running?'Pause':'Resume'; };
$('#sound').onclick=()=>{ audioStart(); setSound(!soundOn); };
$('#resetView').onclick=()=>{ if(camMode==='fp') setCamMode('orbit',true); document.querySelectorAll('#camMode button').forEach(x=>x.classList.toggle('on',x.dataset.mode==='orbit')); setView('quay'); };
$('#reset').onclick=resetAll;
$('#handle').onclick=()=>{ const p=$('#panel'); const c=p.classList.toggle('collapsed'); $('#handle').setAttribute('aria-expanded',String(!c)); $('#handleState').textContent=c?'Show':'Hide'; };
function resetAll(){
  H.fill(0); V.fill(0); jelly.ax=jelly.az=jelly.vx=jelly.vz=jelly.tx=jelly.tz=0;
  buoysOut.forEach(b=>dio.remove(b.m)); buoysOut.length=0; pellets.length=0; drops.length=0;
  stats.boxes=stats.voyages=stats.fed=0;
  cargo.forEach(c=>{ if(c.mesh.parent) c.mesh.parent.remove(c.mesh); c.shrink=1; });
  Object.assign(shipState,{mode:'docked',departing:false,u:0,timer:0,heading:0,scale:1,speed:0}); shipState.pos.set(DOCK.x,BASE_L,DOCK.z);
  loadCargo(); resetCranes();
  firmness=1; damping=.35; tideTarget=0; $('#firm').value=1; $('#damp').value=.35; $('#tide').value=0; $('#firmOut').textContent='1.00'; $('#dampOut').textContent='0.35'; $('#tideOut').textContent='0 cm';
  running=true; $('#pause').textContent='Pause';
  refreshUI();
}

/* ---------------------------------------------------------------- resize & loop */
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; if(w>720) camera.setViewOffset(w,h,Math.min(150,w*.1),-h*.02,w,h); else camera.setViewOffset(w,h,0,h*.12,w,h); camera.updateProjectionMatrix(); sizeBg(); }
window.addEventListener('resize',()=>{ resize(); if(camMode==='orbit'&&!tween&&viewName==='quay') setView('quay',true); });

loadCargo(); resetCranes();
applyFlavour('seaglass');
applyAtmo('cosmos');
resize();
setView('quay',true);
refreshUI();

let simT=0, acc=0, last=performance.now(), bgTick=0, gullTimer=6;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(running){
    simT+=dt;
    L=lerp(L,BASE_L+tideTarget,Math.min(1,dt*1.5));
    updateJelly(dt);
    acc+=dt; let n=0; while(acc>1/120&&n<4){ simStep(); acc-=1/120; n++; } if(n>=4) acc=0;
    // little tug circling the outer harbour
    tugState.a+=dt*.32; const tx=.6+Math.cos(tugState.a)*3.6, tz=8.6+Math.sin(tugState.a)*2.0;
    const tdx=-Math.sin(tugState.a)*3.6, tdz=Math.cos(tugState.a)*2.0;
    tug.position.set(tx,surfH(tx,tz)+.02,tz); tug.rotation.set(0,Math.atan2(-tdz,tdx),0);
    addDrop(tx-Math.cos(tug.rotation.y)*.45,tz+Math.sin(tug.rotation.y)*.45,.45,.0055);
    updateShip(dt,simT); updateCranes(dt); updateFish(dt,simT); updateRings(dt,simT); updateGulls(dt,simT);
    gullTimer-=dt; if(gullTimer<=0){ gullTimer=rand(7,15); if(atmo!=='night') sfx.gull(); }
  }
  updateWater(simT);
  for(const b of moored){ const y=surfH(b.x,b.z); b.g.position.set(b.x,y,b.z); const e=.3; b.g.rotation.z=(surfH(b.x+e,b.z)-surfH(b.x-e,b.z))*1.2; b.g.rotation.x=Math.sin(simT*.8+b.p)*.03; }
  for(const b of buoys){ b.g.position.set(b.x,surfH(b.x,b.z),b.z); b.g.rotation.z=Math.sin(simT*1.3+b.x)*.12; }
  // seaweed sway
  for(let i=0;i<SEAWEED;i++){ const w=weedData[i]; dm.position.set(w.x,.05,w.z); dm.rotation.set(Math.sin(simT*.9+w.p)*.18,0,Math.cos(simT*.7+w.p)*.14); dm.scale.set(1,Math.min(w.h,L-.25),1); dm.updateMatrix(); weed.setMatrixAt(i,dm.matrix); }
  weed.instanceMatrix.needsUpdate=true;
  causticTex.offset.set(simT*.012,simT*.008);
  beamGroup.rotation.y=simT*.6;
  waterUniforms.uTime.value=simT;
  updateCamera(dt);
  renderer.render(scene,camera);
  bgTick+=dt; if(bgTick>.12){ bgTick=0; drawBg(simT); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// keep progress across live updates of the page
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({stats:{...stats},atmo,flavour,firmness,damping}));
const restore=d=>{ if(!d) return; if(d.stats) Object.assign(stats,d.stats); if(d.atmo) applyAtmo(d.atmo); if(d.flavour) applyFlavour(d.flavour); refreshUI(); };
if(hot&&hot.ready) hot.ready(restore); else restore(hot&&hot.data);
})();
</script>
